name: Rust and WASM quality gates

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ forgejo.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2

jobs:
  rust-quality:
    name: Rust format and Clippy
    runs-on: personal
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install native build dependencies
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl build-essential pkg-config libssl-dev \
            libasound2-dev libudev-dev libx11-dev libxcursor-dev libxi-dev \
            libxrandr-dev libwayland-dev libxkbcommon-dev libvulkan-dev

      - name: Install Rust
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain 1.96
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" component add clippy rustfmt

      - name: Restore Cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Deny Clippy warnings
        run: cargo clippy --workspace --all-targets -- -D warnings

  rust-test-build:
    name: Build test archive once
    needs: [rust-quality, supply-chain]
    runs-on: personal
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install native build dependencies
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl build-essential pkg-config libssl-dev \
            libasound2-dev libudev-dev libx11-dev libxcursor-dev libxi-dev \
            libxrandr-dev libwayland-dev libxkbcommon-dev libvulkan-dev

      - name: Install Rust
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain 1.96
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Restore Cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-

      - name: Install cargo-nextest
        run: |
          set -euo pipefail
          curl -LsSf https://get.nexte.st/latest/linux \
            | tar zxf - -C "$HOME/.cargo/bin"

      - name: Build workspace test archive
        run: cargo nextest archive --workspace --archive-file target/nextest-archive.tar.zst

      - name: Upload workspace test archive
        uses: https://data.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: workspace-nextest-archive
          path: target/nextest-archive.tar.zst
          retention-days: 1

  rust-tests:
    name: Rust tests (shard ${{ matrix.shard }}/4)
    needs: rust-test-build
    runs-on: personal
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install native runtime dependencies
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl libssl3 libasound2 libudev1 libx11-6 libxcursor1 libxi6 \
            libxrandr2 libwayland-client0 libxkbcommon0 libvulkan1

      - name: Install cargo-nextest
        run: |
          set -euo pipefail
          mkdir -p "$HOME/.cargo/bin"
          curl -LsSf https://get.nexte.st/latest/linux \
            | tar zxf - -C "$HOME/.cargo/bin"
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Download workspace test archive
        uses: https://data.forgejo.org/forgejo/download-artifact@v4
        with:
          name: workspace-nextest-archive
          path: target

      - name: Run workspace test shard
        run: cargo nextest run --archive-file target/nextest-archive.tar.zst --profile ci --partition "hash:${{ matrix.shard }}/4"

  wasm:
    name: Build browser client
    needs: [rust-quality, supply-chain]
    runs-on: personal
    timeout-minutes: 90
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install WASM build dependencies
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl build-essential pkg-config binaryen

      - name: Install Rust and WASM target
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain 1.96
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" target add wasm32-unknown-unknown

      - name: Restore Cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: wasm-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: wasm-${{ runner.os }}-

      - name: Install Trunk
        run: cargo install trunk --locked

      - name: Build release browser bundle
        run: scripts/build-web.sh

      - name: Report transfer size
        run: |
          set -euo pipefail
          du -ah crates/cat-web/dist | sort -h | tail -20

  supply-chain:
    name: Dependency advisories and sources
    runs-on: personal
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Check advisories, bans, and dependency sources
        uses: https://github.com/EmbarkStudios/cargo-deny-action@v2
        with:
          command: check advisories bans sources
