name: Unity simulation and shared-world quality

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  CARGO_BUILD_JOBS: 2

concurrency:
  group: cat-idler-quality-${{ forgejo.ref }}
  cancel-in-progress: true

jobs:
  simulation:
    name: C# rules, real sockets and legacy saves
    runs-on: cat-idler-heavy
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - name: Install converter build and verification tools
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl build-essential python3
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.400'
      - name: Restore locked dependencies
        run: dotnet restore IdleCatForest.slnx --locked-mode
      - name: Compile with warnings as errors
        run: dotnet build IdleCatForest.slnx --no-restore -warnaserror
      - name: Check C# formatting
        run: dotnet format whitespace IdleCatForest.slnx --no-restore --verify-no-changes
      - name: Run all simulation scenarios
        run: |
          set -o pipefail
          mkdir -p artifacts/ci
          dotnet tools/scenarios/bin/Debug/net10.0/Forest.Scenarios.dll | tee artifacts/ci/scenarios.txt
      - name: Run authority and real socket tests
        run: |
          set -o pipefail
          dotnet server/Forest.Tests/bin/Debug/net10.0/Forest.Tests.dll | tee artifacts/ci/authority.txt
      - name: Install the read-only legacy converter toolchain
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --profile minimal --default-toolchain 1.98.0
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
      - name: Verify real SQLite conversion and source preservation
        run: |
          cargo build --locked --manifest-path tools/save-import/normalize-legacy/Cargo.toml
          python3 -m unittest tools/save-import/test_playable_import.py tools/save-import/test_legacy_archive.py
      - name: Publish test evidence
        if: always()
        uses: https://data.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: unity-simulation-reports
          path: artifacts/ci
          if-no-files-found: warn
