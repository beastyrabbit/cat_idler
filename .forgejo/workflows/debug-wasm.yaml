name: Debug WASM job steps

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2

jobs:
  debug:
    name: Reproduce browser-client setup
    runs-on: personal
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Apt install
        run: |
          set -euxo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl build-essential pkg-config libssl-dev \
            binaryen

      - name: Rust toolchain
        run: |
          set -euxo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain 1.96
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" target add wasm32-unknown-unknown

      - name: Install trunk
        run: |
          set -euxo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo install trunk --locked --version 0.21.14

      - name: Restore Cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: wasm-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: wasm-${{ runner.os }}-

      - name: Build release browser bundle
        run: |
          set -euxo pipefail
          export PATH="$HOME/.cargo/bin:$PATH"
          scripts/build-web.sh

      - name: Report versions
        if: always()
        run: |
          export PATH="$HOME/.cargo/bin:$PATH"
          cargo --version
          rustc --version
          trunk --version || true
          wasm-opt --version || true
