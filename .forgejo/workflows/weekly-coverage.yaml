name: Weekly LLVM coverage

on:
  schedule:
    - cron: "30 10 * * 0"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cat-idler-heavy-coverage
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  CAT_PLAYTEST_SEED_TIER: high-risk
  CAT_PLAYTEST_TRACE_DIR: target/playtest-traces

jobs:
  coverage:
    name: Workspace coverage and regression gate
    runs-on: cat-idler-heavy
    timeout-minutes: 230
    steps:
      - uses: actions/checkout@v6

      - name: Install native build dependencies
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl build-essential pkg-config libssl-dev jq time \
            libasound2-dev libudev-dev libx11-dev libxcursor-dev libxi-dev \
            libxrandr-dev libwayland-dev libxkbcommon-dev libvulkan-dev

      - name: Install Rust, LLVM tools, Nextest, and cargo-llvm-cov
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain 1.96
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/rustup" component add llvm-tools-preview
          curl -LsSf https://get.nexte.st/latest/linux \
            | tar zxf - -C "$HOME/.cargo/bin"
          cargo install cargo-llvm-cov --locked

      - name: Restore Cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: coverage-rust-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: coverage-rust-${{ runner.os }}-

      - name: Restore first measured per-crate baseline
        id: coverage-baseline-cache
        uses: actions/cache/restore@v5
        with:
          path: target/coverage-baseline.json
          key: cat-idler-coverage-baseline-v1

      - name: Verify effective job resource ceilings
        run: |
          set -euo pipefail
          mkdir -p target/coverage
          read -r cpu_quota cpu_period < /sys/fs/cgroup/cpu.max
          memory_limit="$(cat /sys/fs/cgroup/memory.max)"
          if [ "$cpu_quota" = max ] || [ "$memory_limit" = max ]; then
            echo 'Heavy job is missing an effective CPU or memory ceiling.' >&2
            exit 1
          fi
          cpu_millis="$((cpu_quota * 1000 / cpu_period))"
          printf 'cpu_millis=%s\nmemory_bytes=%s\n' "$cpu_millis" "$memory_limit" \
            | tee target/coverage/cgroup-limits.txt
          test "$cpu_millis" -le 2000
          test "$memory_limit" -le $((5 * 1024 * 1024 * 1024))

      - name: Run instrumented workspace suite
        id: coverage-tests
        continue-on-error: true
        run: |
          set -o pipefail
          rm -rf target/playtest-traces
          mkdir -p target/coverage target/coverage-html target/playtest-traces
          /usr/bin/time -v -o target/coverage/resources.txt \
            cargo llvm-cov nextest --workspace --profile ci --no-report 2>&1 \
            | tee target/coverage/timing.log

      - name: Produce JSON, LCOV, and HTML reports
        if: always()
        run: |
          set -euo pipefail
          cargo llvm-cov report --json --output-path target/coverage/coverage.json
          cargo llvm-cov report --lcov --output-path target/coverage/lcov.info
          cargo llvm-cov report --html --output-dir target/coverage-html

      - name: Check per-crate coverage regression
        id: baseline
        if: always()
        run: |
          set -euo pipefail
          jq '
            .data[0].files
            | map(select(.filename | test("(^|/)crates/[^/]+/")))
            | group_by(.filename | capture("(^|/)crates/(?<crate>[^/]+)/").crate)
            | map({
                key: (.[0].filename | capture("(^|/)crates/(?<crate>[^/]+)/").crate),
                value: ((map(.summary.lines.covered) | add)
                  / (map(.summary.lines.count) | add) * 100)
              })
            | from_entries
          ' target/coverage/coverage.json > target/coverage/current-baseline.json

          if [ ! -s target/coverage-baseline.json ]; then
            cp target/coverage/current-baseline.json target/coverage-baseline.json
            echo 'First measured per-crate baseline established in runner cache.' \
              >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          regressions="$(jq -n \
            --slurpfile baseline target/coverage-baseline.json \
            --slurpfile current target/coverage/current-baseline.json '
              [$baseline[0] | to_entries[] as $entry
                | ($current[0][$entry.key] // 0) as $actual
                | select(($actual + 0.5) < $entry.value)
                | {crate: $entry.key, baseline: $entry.value, actual: $actual}]
            ')"
          echo "$regressions" > target/coverage/regressions.json
          if [ "$(jq length <<< "$regressions")" -ne 0 ]; then
            echo 'Coverage regressed by more than 0.5 percentage points:' >&2
            jq -r '.[] | "\(.crate): \(.baseline)% -> \(.actual)%"' <<< "$regressions" >&2
            exit 1
          fi

      - name: Save first measured per-crate baseline
        if: always() && steps.baseline.outcome == 'success' && steps.coverage-baseline-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: target/coverage-baseline.json
          key: cat-idler-coverage-baseline-v1

      - name: Publish coverage and failure traces
        if: always()
        uses: https://data.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: weekly-coverage
          path: |
            target/coverage/
            target/coverage-html/
            target/playtest-traces/
            target/nextest/ci/
          if-no-files-found: warn

      - name: Summarize coverage
        if: always()
        run: |
          {
            echo '## Weekly LLVM coverage'
            echo '- Test result: `${{ steps.coverage-tests.outcome }}`'
            echo '- Baseline result: `${{ steps.baseline.outcome }}`'
            echo '- JSON, LCOV, HTML, timings, JUnit, and traces: `weekly-coverage` artifact'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce coverage gates
        if: steps.coverage-tests.outcome != 'success' || steps.baseline.outcome != 'success'
        run: exit 1
