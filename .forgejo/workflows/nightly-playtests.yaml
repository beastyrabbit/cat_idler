name: Extended C# colony campaigns

on:
  schedule:
    - cron: "30 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: cat-idler-extended
  cancel-in-progress: false

jobs:
  campaigns:
    name: Fresh, established and shared-world seed campaigns
    runs-on: cat-idler-heavy
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: '10.0.400'
      - run: dotnet restore tools/scenarios/Forest.Scenarios.csproj --locked-mode
      - run: dotnet build tools/scenarios/Forest.Scenarios.csproj --no-restore -warnaserror
      - name: Run every extended campaign
        run: |
          set -o pipefail
          mkdir -p artifacts/ci
          dotnet tools/scenarios/bin/Debug/net10.0/Forest.Scenarios.dll --filter=campaign. | tee artifacts/ci/campaigns.txt
      - name: Publish campaign evidence
        if: always()
        uses: https://data.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: colony-campaigns
          path: artifacts/ci
          if-no-files-found: warn
