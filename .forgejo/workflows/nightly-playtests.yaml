name: Nightly deterministic playtest cohort

on:
  schedule:
    - cron: "30 8 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cat-idler-heavy-extended
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: 2
  CAT_PLAYTEST_SEED_TIER: nightly
  CAT_PLAYTEST_TRACE_DIR: target/playtest-traces

jobs:
  nightly:
    name: All 32 deterministic seeds
    runs-on: cat-idler-heavy
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v6

      - name: Install native build dependencies
        run: |
          set -euo pipefail
          apt-get update
          apt-get install -y --no-install-recommends \
            ca-certificates curl build-essential pkg-config libssl-dev time \
            libasound2-dev libudev-dev libx11-dev libxcursor-dev libxi-dev \
            libxrandr-dev libwayland-dev libxkbcommon-dev libvulkan-dev

      - name: Install Rust and Nextest
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain 1.96
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          curl -LsSf https://get.nexte.st/latest/linux \
            | tar zxf - -C "$HOME/.cargo/bin"

      - name: Restore Cargo cache
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: rust-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: rust-${{ runner.os }}-

      - name: Verify effective job resource ceilings
        run: |
          set -euo pipefail
          mkdir -p target/nextest/nightly
          read -r cpu_quota cpu_period < /sys/fs/cgroup/cpu.max
          memory_limit="$(cat /sys/fs/cgroup/memory.max)"
          if [ "$cpu_quota" = max ] || [ "$memory_limit" = max ]; then
            echo 'Heavy job is missing an effective CPU or memory ceiling.' >&2
            exit 1
          fi
          cpu_millis="$((cpu_quota * 1000 / cpu_period))"
          printf 'cpu_millis=%s\nmemory_bytes=%s\n' "$cpu_millis" "$memory_limit" \
            | tee target/nextest/nightly/cgroup-limits.txt
          test "$cpu_millis" -le 2000
          test "$memory_limit" -le $((5 * 1024 * 1024 * 1024))

      - name: Run extended scenario cohort
        id: cohort
        continue-on-error: true
        run: |
          set -o pipefail
          rm -rf target/playtest-traces
          mkdir -p target/nextest/nightly target/playtest-traces
          /usr/bin/time -v -o target/nextest/nightly/nightly-resources.txt \
            cargo nextest run -p cat-server --profile nightly \
            -E 'test(/playtest_scenarios/)' 2>&1 \
            | tee target/nextest/nightly/nightly-timing.log

      - name: Publish nightly evidence
        if: always()
        uses: https://data.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: nightly-playtest-reports
          path: |
            target/nextest/nightly/
            target/playtest-traces/
          if-no-files-found: warn

      - name: Summarize nightly cohort
        if: always()
        run: |
          {
            echo '## Nightly 32-seed playtest cohort'
            echo '- Seeds: `0..=27, 42, 99, 4242, 0xCA97_A111`'
            echo '- Result: `${{ steps.cohort.outcome }}`'
            echo '- Evidence: `nightly-playtest-reports` artifact'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Enforce cohort result
        if: steps.cohort.outcome != 'success'
        run: exit 1
