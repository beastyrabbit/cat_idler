name: CI
on:
  push:
  pull_request:
  workflow_dispatch:

# Builds and tests the .NET side (simulation scenarios, authority and server
# tests) and scans the whole git history for secrets.
#
# There is no Unity job: the arc-cat-idler runner has no Unity install. The
# Unity-only assemblies (Presentation, Editor, PlayMode tests) are compiled
# locally with `bash tools/forest.sh check`, and the EditMode and PlayMode
# suites run locally with `forest.sh edit-test` and `forest.sh play-test`.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: 'true'

jobs:
  dotnet:
    name: .NET build, scenarios and server tests
    runs-on: arc-cat-idler
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json
      - name: Restore locked dependencies
        run: dotnet restore IdleCatForest.slnx --locked-mode
      - name: Build with warnings as errors
        run: dotnet build IdleCatForest.slnx -c Release -warnaserror --no-restore
      - name: Run simulation scenarios
        # Campaigns and demo timing scenarios are opt-in and stay local.
        run: dotnet run --project tools/scenarios -c Release --no-build -- --jobs=0
      - name: Run authority and server tests
        run: bash tools/forest.sh server-test

  gitleaks:
    name: Secret scan (gitleaks)
    runs-on: arc-cat-idler
    timeout-minutes: 15
    env:
      GITLEAKS_VERSION: 8.30.1
      # SHA-256 values from gitleaks_8.30.1_checksums.txt of the official release.
      GITLEAKS_SHA256_X64: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
      GITLEAKS_SHA256_ARM64: e4a487ee7ccd7d3a7f7ec08657610aa3606637dab924210b3aee62570fb4b080
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          # the scan covers every commit on every fetched ref
          fetch-depth: 0
          persist-credentials: false
      - name: Install pinned gitleaks
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64|amd64) arch=x64; sum="$GITLEAKS_SHA256_X64" ;;
            aarch64|arm64) arch=arm64; sum="$GITLEAKS_SHA256_ARM64" ;;
            *) echo "Unsupported runner architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          if ! command -v curl >/dev/null 2>&1; then
            sudo apt-get update -qq
            sudo apt-get install -y -qq --no-install-recommends ca-certificates curl
          fi
          archive="gitleaks_${GITLEAKS_VERSION}_linux_${arch}.tar.gz"
          dir="$RUNNER_TEMP/gitleaks"
          mkdir -p "$dir"
          curl --proto '=https' --tlsv1.2 -fsSL -o "$dir/$archive" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/${archive}"
          echo "$sum  $dir/$archive" | sha256sum --check --strict
          tar -xzf "$dir/$archive" -C "$dir" gitleaks
          echo "$dir" >> "$GITHUB_PATH"
      - name: Scan the full history
        # .gitleaksignore at the repository root holds the reviewed historical findings.
        run: gitleaks detect --no-banner --redact --log-opts=--all
