[workspace]
resolver = "3"
members = [
    "crates/cat-sim",
    "crates/cat-protocol",
    "crates/cat-server",
    "crates/cat-client",
    "crates/cat-desktop",
    "crates/cat-web",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
repository = "https://git.heerlab.com/beasty/cat_idler"

# Shared dependency versions. Individual crates opt in via
# `foo = { workspace = true }`. Keep everything on the newest releases.
[workspace.dependencies]
# simulation core + protocol (path deps, wired as the crates gain content)
cat-sim = { path = "crates/cat-sim" }
cat-protocol = { path = "crates/cat-protocol" }
cat-client = { path = "crates/cat-client" }

# serialization / data
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# engine (client). Keep in lockstep with the BRP-verified spike.
bevy = "0.19"

[profile.dev]
# Bevy is unusably slow in a fully-unoptimized dev profile; optimize deps.
opt-level = 1
[profile.dev.package."*"]
opt-level = 3
