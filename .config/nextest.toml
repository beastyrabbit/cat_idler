[profile.smoke]
fail-fast = true
test-threads = 2
default-filter = '''
package(=cat-protocol)
| (package(=cat-client) & test(/^(tests::(attributed_events_show_only_the_player_name|authoritative_settlement_clear_overrides_generated_water_and_snow|browser_window_follows_parent_while_native_keeps_requested_size|command_categories_cover_each_world_tool_and_quick_action_once|focused_start_input_has_a_visible_cursor|start_names_are_trimmed_bounded_and_require_visible_content|startup_restore_marks_the_persisted_village_for_authenticated_rejoin|visible_command_registry_emits_the_expected_protocol_manifest_slice))$/))
| (package(=cat-server) & test(/^(hosting::tests::local_defaults_do_not_require_static_files_or_an_origin|identity::tests::hmac_sig_verify_accepts_signed_session_and_rejects_bad_sigs|persistence::tests::player_name_history_is_global_and_updates_last_seen|persistence::tests::save_world_load_world_round_trips_every_field_in_the_persistence_audit|playtest_harness::tests::(malformed_and_production_test_actions_are_observed_not_discarded|real_socket_auth_tick_save_restart_and_reconnect_is_deterministic|real_socket_rate_limit_rejects_the_bounded_burst_and_recovers)|playtest_scenarios::(deterministic_seed_cohorts_match_the_playtest_contract_exactly|every_manifest_entry_has_an_executable_websocket_runner|forgejo_and_nextest_files_keep_the_capped_execution_contract|scenario_manifest_has_unique_stable_ids_and_valid_seed_tiers|scenario_specs_are_complete_and_anchor_real_design_headings)|playtest_scenarios::catalog_journeys::executable_catalog_inventory_is_exhaustive_and_stable|playtest_scenarios::scouting::scouting_manifest_covers_every_mission_and_outcome_family|playtest_scenarios::system_journeys::executable_system_ids_are_unique_and_exclude_catalog_sweeps|playtest_scenarios::weapons_leader::manifest_keeps_mechanical_captain_and_leader_expectations_separate|playtest_scenarios::worker_catalog::(client_action_manifest_has_stable_names_valid_wires_and_malformed_cases|production_queue_equipment_recipe_and_research_sweep_aggregates_failures|typed_catalog_sweep_aggregates_every_current_option|worker_manifest_covers_all_nineteen_skills_and_scout_threshold)|tests::actions_require_a_socket_bound_presence_identity|tests::player_names_are_normalized_and_action_tags_are_readable|tests::restored_bearer_owns_the_same_village_after_database_reload)$/))
| (package(=cat-sim) & test(/^(actions::tests::build_snapshot_exposes_a_scouts_provisional_tiles_dedeuped_and_sorted|pathfinding::tests::a_new_bridge_replans_an_unreachable_route_through_the_crossing|world_tick::tests::(bridge_placement_accepts_one_water_tile_and_rejects_land_or_a_missing_bank|deliberate_roads_queue_physical_corridor_and_keep_material_reserve|founding_never_places_a_building_or_road_on_water|leader_general_scouting_has_a_short_visible_cadence|physical_bridge_keeps_water_and_becomes_a_horizontal_crossing_after_work|regular_cat_walking_permanently_reveals_a_three_by_three_trail|scout_provisional_commits_to_revealed_tiles_on_shrine_return_and_clears|scout_vision_starts_at_five_and_caps_at_twelve_tiles|staffed_steward_commissions_a_high_value_revealed_crossing))$/))
'''

[profile.smoke.junit]
path = "target/nextest/smoke/junit.xml"

[profile.ci]
fail-fast = false
test-threads = 2
slow-timeout = { period = "300s", terminate-after = 6 }

[profile.ci.junit]
path = "target/nextest/ci/junit.xml"

[profile.nightly]
inherits = "ci"
slow-timeout = { period = "300s", terminate-after = 24 }

[profile.nightly.junit]
path = "target/nextest/nightly/junit.xml"

[test-groups]
singleton = { max-threads = 1 }

[[profile.ci.overrides]]
filter = 'test(/framebuffer|single_instance|singleton/)'
test-group = 'singleton'
