<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, user-scalable=no" />
    <title>Idle Cat Forest</title>
    <link rel="icon" type="image/png" href="favicon.png" />
    <!-- Ship the tab icon (a pixel cat) next to index.html in dist/. -->
    <link data-trunk rel="copy-file" href="assets/favicon.png" />
    <!-- Trunk compiles the cat-web bin to wasm + generates the JS glue. -->
    <link data-trunk rel="rust" data-bin="cat-web" data-wasm-opt="z" />
    <!-- Bevy's AssetPlugin uses file_path=".", and the client loads
         "public/images/..." — copy that tree so those fetches resolve at the
         same relative path in the served dist. -->
    <link
      data-trunk
      rel="copy-dir"
      href="../../public/images"
      data-target-path="public/images"
    />
    <style>
      html,
      body {
        margin: 0;
        height: 100%;
        background: #0f1613;
        overflow: hidden;
      }
      /* Bevy/winit renders into the explicitly configured game canvas. */
      canvas {
        display: block;
        width: 100vw;
        height: 100vh;
      }
    </style>
  </head>
  <body><canvas id="cat-game" tabindex="0" aria-label="Idle Cat Forest"></canvas></body>
</html>
