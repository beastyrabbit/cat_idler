# Trunk bundle config for the browser (wasm) client. See docs/migration/WASM.md.
#
#   cd crates/cat-web
#   CAT_SERVER_URL=ws://127.0.0.1:8787/ws trunk build --release   # bundle -> dist/
#   trunk serve --release                                          # + live-serve
#
# The CAT_SERVER_URL env is baked into the wasm at build time (option_env! in
# cat-client::server_ws_url); omit it for a same-origin deploy where the browser
# derives ws(s)://<host>/ws from the page location.

[build]
# Default to release-shaped output paths; pass --release to actually optimize.
dist = "dist"

[serve]
address = "127.0.0.1"
port = 8080
# Never fall back to serving index.html for missing asset requests — a 404 on a
# sprite should read as a 404, not silently return HTML.
no_spa = true
