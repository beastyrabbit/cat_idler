[package]
name = "cat-client"
version = "0.1.0"
edition = "2024"

[dependencies]
# Renderer/UI/windowing features common to native + wasm. Cargo unions these
# with the target-specific bevy entries below, so native keeps x11/wayland/
# multi_threaded and wasm adds the WebGL2 backend.
bevy = { version = "0.19", default-features = false, features = ["bevy_asset", "bevy_core_pipeline", "bevy_render", "bevy_sprite", "bevy_text", "bevy_ui", "bevy_winit", "bevy_log", "default_font", "png", "bevy_sprite_render", "bevy_ui_render"] }
cat-protocol.workspace = true
cat-sim.workspace = true
ewebsock = "0.8.0"
serde_json.workspace = true

# Native only: Linux windowing backends + the multithreaded executor. These do
# not apply to wasm (winit uses the browser canvas; wasm runs single-threaded).
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
bevy = { version = "0.19", default-features = false, features = ["multi_threaded", "x11", "wayland"] }

# Browser only: wgpu's WebGL2 backend, so the client renders on the near-universal
# WebGL2 (rather than requiring WebGPU, which not all browsers expose yet).
# web-sys reads window.location to derive the same-origin WS URL in the browser.
[target.'cfg(target_arch = "wasm32")'.dependencies]
bevy = { version = "0.19", default-features = false, features = ["webgl2"] }
web-sys = { version = "0.3", features = ["Window", "Location"] }
