pre-commit:
  parallel: true
  commands:
    gitleaks:
      run: gitleaks protect --staged --no-banner
    csharp-format:
      glob: "*.cs"
      run: dotnet format whitespace IdleCatForest.slnx --no-restore --verify-no-changes

pre-push:
  piped: true
  commands:
    1_csharp-build:
      run: dotnet build IdleCatForest.slnx --no-restore -warnaserror
    2_scenarios:
      run: dotnet run --project tools/scenarios -c Release -- --jobs=0
    3_server-tests:
      run: bash tools/forest.sh server-test
