pre-commit:
  parallel: true
  commands:
    gitleaks:
      run: gitleaks protect --staged --no-banner
    csharp-format:
      glob: "*.cs"
      run: dotnet format whitespace IdleCatForest.slnx --no-restore --verify-no-changes

pre-push:
  commands:
    csharp-build:
      run: dotnet build IdleCatForest.slnx --no-restore -warnaserror
    focused-scenarios:
      run: dotnet tools/scenarios/bin/Debug/net10.0/Forest.Scenarios.dll --exclude-campaigns
