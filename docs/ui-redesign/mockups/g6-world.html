<!doctype html><html><head><meta charset="utf-8"><link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Instrument+Serif:ital@1&display=swap" rel="stylesheet"><link rel="stylesheet" href="glass.css"><title>Glass — World & expedition</title>
<style>.fl{display:flex;gap:5px;margin:8px 0}.fl div{flex:1;border:1px solid var(--edge);border-radius:8px;padding:5px 8px;font-size:11px;color:var(--dim);font-weight:700}.fl div b{display:block;color:var(--ink);font-size:12px}.fl .done{border-color:var(--ok)}.fl .done b{color:var(--ok)}.fl .now{border-color:var(--sun);background:rgba(255,209,102,.12)}.fl .now b{color:var(--sun)}
.prog{height:6px;background:rgba(255,255,255,.12);border-radius:3px;margin:4px 0 8px;overflow:hidden}.prog i{display:block;height:100%;width:38%;background:var(--sun)}
.cargo{display:flex;gap:4px;margin:4px 0 8px}.cargo i{width:26px;height:26px;border:1px solid var(--edge);border-radius:6px;display:grid;place-items:center}.cargo i img{width:16px;height:16px;image-rendering:pixelated}.cargo i.e{border-style:dashed;opacity:.5}</style></head><body>
<canvas id="w" width="1920" height="1080"></canvas><canvas id="ov" width="1920" height="1080"></canvas>
<script src="icons.js"></script><script src="world.js"></script><script src="glass.js"></script>
<script>
const sheet='<div class="hd"><h2>World</h2><p>Surface · 2 known sites · 1 expedition out</p><span class="x">ESC</span></div>'
+'<div class="chips"><span class="fchip on">Surface</span><span class="fchip">Root Hollow · 1</span><span class="fchip hot">Root Hollow · 2</span><span class="fchip">Root Hollow · 3 · unseen</span><span class="fchip">Scouts</span><span class="fchip">Villages</span></div>'
+'<table class="tbl"><thead><tr><th>Site</th><th>Where</th><th>Threat</th><th>Explored</th><th>State</th></tr></thead><tbody>'
+'<tr class="sel"><td><b>Root Hollow</b><br><span class="dim">dungeon · 3 floors</span></td><td>14 tiles W of the west gate</td><td>moderate · badgers</td><td>2 of 3 · 3 chests left</td><td><span class="state waiting">Ash inside</span></td></tr>'
+'<tr><td><b>Bramblewood shaft</b><br><span class="dim">seen, not entered</span></td><td>22 tiles NE, past the river</td><td class="dim">unknown</td><td class="dim">0 of ?</td><td><span class="state manual">Needs a ready cat</span></td></tr>'
+'<tr><td><b>Mosslight</b><br><span class="dim">player village</span></td><td>140 tiles S · road unbuilt</td><td>—</td><td>—</td><td><span class="state auto">Trade offer open</span></td></tr>'
+'</tbody></table><p style="margin:14px 0 0;font:800 10px Manrope;letter-spacing:.12em;text-transform:uppercase;color:var(--dim)">Who could go next</p>'
+'<table class="tbl"><thead><tr><th>Cat</th><th>Health</th><th>Fighting</th><th>Equipment</th><th>Ready?</th></tr></thead><tbody>'
+'<tr><td><b>Wren</b> · warrior</td><td class="num">100</td><td>●●●○○</td><td>iron sword · leather cap</td><td class="ok">ready · guarding</td></tr>'
+'<tr><td><b>Moss</b> · smith</td><td class="num">97</td><td>●●○○○</td><td class="dim">none</td><td class="bad">eat first · needs a weapon</td></tr>'
+'<tr><td><b>Thistle</b></td><td class="num">100</td><td>○○○○○</td><td class="dim">none</td><td class="bad">no fighting skill</td></tr></tbody></table>';
const card='<div class="hd"><div class="portrait" style="background-position:-268px 4px;filter:saturate(0) brightness(.95)"></div><div><b>Ash</b><small>Explorer · fighting 2, scouting 3 · left 12:10</small></div></div>'
+'<div class="now">Inside <u>Root Hollow</u>, floor 2 of 3, fighting a badger<br><span class="why">retreats on her own below 50 health</span></div>'
+'<div class="fl"><div class="done"><b>Floor 1</b>cleared</div><div class="now"><b>Floor 2</b>guardian</div><div><b>Floor 3</b>unseen</div></div>'
+'<div class="kv"><em>Cargo</em><b>2 of 6 loads</b><em>Route home</em><b>41 tiles</b></div><div class="prog"><i></i></div>'
+'<div class="rings"><div class="ring"><div style="background:conic-gradient(#7ed37a 82%,rgba(255,255,255,.12) 0)"><span>82</span></div>health</div><div class="ring"><div style="background:conic-gradient(#ffd166 50%,rgba(255,255,255,.12) 0)"><span>50</span></div>hunger</div><div class="ring"><div style="background:conic-gradient(#ffd166 54%,rgba(255,255,255,.12) 0)"><span>54</span></div>thirst</div></div>'
+'<div class="acts"><span class="act hot">Recall</span><span class="act">Follow</span><span class="act q">Control · Tab</span></div>';
glassChrome({tab:'World',sheet,card:{html:card,x:1000,y:300,ax:870,ay:400}});
renderWorld(document.getElementById('w'),{scale:3,ox:740,oy:-20,annotate:false}).then(({px,py})=>{const o=document.getElementById('ov').getContext('2d');
 const route=[[7.5,11.5],[5.5,11.5],[5.5,9.5],[3.2,8.8]];o.lineCap='round';o.lineJoin='round';o.strokeStyle='rgba(0,0,0,.45)';o.lineWidth=7;o.beginPath();route.forEach(([x,y],i)=>i?o.lineTo(px(x),py(y)):o.moveTo(px(x),py(y)));o.stroke();
 o.strokeStyle='#ffd166';o.lineWidth=3;o.setLineDash([10,9]);o.beginPath();route.forEach(([x,y],i)=>i?o.lineTo(px(x),py(y)):o.moveTo(px(x),py(y)));o.stroke();o.setLineDash([]);
 o.fillStyle='#3b3b3b';o.beginPath();o.ellipse(px(2.6),py(8.6),30,18,0,0,Math.PI*2);o.fill();o.fillStyle='#0b0d0c';o.beginPath();o.ellipse(px(2.6),py(8.8),20,10,0,0,Math.PI*2);o.fill();
 o.strokeStyle='#ffd166';o.lineWidth=3;o.beginPath();o.ellipse(px(2.6),py(8.6),40,26,0,0,Math.PI*2);o.stroke();});
</script></body></html>
