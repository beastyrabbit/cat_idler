<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Exact task footprints</title><desc id="desc">Fixed Hole, Workshop, Cookhouse and Fishing Hut geometry with high-contrast labels.</desc><style>svg{fill:#271b16}text{font-family:monospace}.h{font-size:28px;font-weight:bold}.s{font-size:16px}.x{font-size:13px}.b{stroke:#271b16;stroke-width:3}.c{stroke:#271b16;stroke-width:2}.on{fill:#fff4d3}</style><rect width="1600" height="1000" fill="#efe2bd"/><rect x="24" y="20" width="1552" height="960" fill="none" stroke="#6d482b" stroke-width="5"/><text x="60" y="70" class="h">AUTHORITATIVE GEOMETRY: COMPLETE FOOTPRINTS</text><text x="60" y="98" class="s">Tasks carry full row-major footprint, work slot, endpoint, route and cargo.</text><text x="90" y="150" class="h">HOLE: FIXED 5×5</text><g transform="translate(100 180)" class="c"><rect width="75" height="75" fill="#6d482b"/><rect x="75" width="75" height="75" fill="#6d482b"/><rect x="150" width="75" height="75" fill="#6d482b"/><rect x="225" width="75" height="75" fill="#6d482b"/><rect x="300" width="75" height="75" fill="#6d482b"/><rect y="75" width="75" height="75" fill="#6d482b"/><rect x="75" y="75" width="75" height="75" fill="#173c2e"/><rect x="150" y="75" width="75" height="75" fill="#173c2e"/><rect x="225" y="75" width="75" height="75" fill="#173c2e"/><rect x="300" y="75" width="75" height="75" fill="#6d482b"/><rect y="150" width="75" height="75" fill="#6d482b"/><rect x="75" y="150" width="75" height="75" fill="#173c2e"/><rect x="150" y="150" width="75" height="75" fill="#173c2e"/><rect x="225" y="150" width="75" height="75" fill="#173c2e"/><rect x="300" y="150" width="75" height="75" fill="#6d482b"/><rect y="225" width="75" height="75" fill="#6d482b"/><rect x="75" y="225" width="75" height="75" fill="#173c2e"/><rect x="150" y="225" width="75" height="75" fill="#173c2e"/><rect x="225" y="225" width="75" height="75" fill="#173c2e"/><rect x="300" y="225" width="75" height="75" fill="#6d482b"/><rect y="300" width="75" height="75" fill="#6d482b"/><rect x="75" y="300" width="75" height="75" fill="#6d482b"/><rect x="150" y="300" width="75" height="75" fill="#6d482b"/><rect x="225" y="300" width="75" height="75" fill="#6d482b"/><rect x="300" y="300" width="75" height="75" fill="#6d482b"/></g><text x="540" y="225" class="s">Nine central work cells; sixteen paved-ring cells.</text><text x="540" y="260" class="s">Pinned delivery edge enters central 3×3.</text><text x="540" y="295" class="s">Axes add layers only; never resize landmark.</text><text x="940" y="150" class="h">WORKSHOP / COOKHOUSE: FULL 3×3</text><rect x="980" y="185" width="235" height="235" fill="#c9d5a8" class="b"/><rect x="1280" y="185" width="235" height="235" fill="#d9b16b" class="b"/><text x="1097" y="310" class="h" text-anchor="middle">W</text><text x="1397" y="310" class="h" text-anchor="middle">C</text><text x="940" y="455" class="x">All nine ordered cells are task and inspection geometry.</text><text x="90" y="600" class="h">FISHING HUT: 3×3 LAND + DOCK + WATER</text><rect x="110" y="640" width="246" height="246" fill="#c9d5a8" class="b"/><rect x="356" y="722" width="82" height="82" fill="#6d482b" class="c"/><rect x="438" y="722" width="82" height="82" fill="#5e91a3" class="c"/><text x="397" y="770" class="s on" text-anchor="middle">D</text><text x="479" y="770" class="s" text-anchor="middle">d</text><text x="610" y="700" class="s">H: nine land cells; D: dock-facing land; d: reserved water.</text><text x="610" y="735" class="s">Placement validates orientation, shoreline and occupancy.</text><text x="610" y="770" class="s">Operation marker uses actual shoreline/water habitat.</text><text x="60" y="930" class="x">Text fallback: Apple tree, water-bank, EnemyLair, CaveEntrance, farm, road, wall and building work use their complete authoritative geometry.</text></svg>
