<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Diplomacy and physical barter</title><desc id="desc">Alliance, Neutral and Enemy stance plus physical barter escrow, caravan and recovery.</desc><style>svg{fill:#271b16}text{font-family:monospace}.h{font-size:28px;font-weight:bold}.s{font-size:16px}.x{font-size:13px}.b{stroke:#271b16;stroke-width:3}.a{stroke:#271b16;stroke-width:3;fill:none}</style><rect width="1600" height="1000" fill="#efe2bd"/><rect x="24" y="20" width="1552" height="960" fill="none" stroke="#6d482b" stroke-width="5"/><text x="60" y="70" class="h">DIPLOMACY: PERSONAL STANCE; TRADE: PHYSICAL BARTER</text><text x="60" y="96" class="s">Canonical value is for comparison only: no coins, purses, prices or settlement.</text><g class="b"><rect x="60" y="150" width="290" height="125" fill="#c9d5a8"/><rect x="430" y="150" width="290" height="125" fill="#d9b16b"/><rect x="800" y="150" width="290" height="125" fill="#a4492d"/><rect x="1170" y="150" width="330" height="125" fill="#4f7040"/></g><text x="90" y="190" class="h">stance</text><text x="90" y="220" class="s">Alliance / Neutral</text><text x="90" y="245" class="s">Enemy</text><text x="460" y="190" class="h">honest label</text><text x="460" y="220" class="s">Alliance = Neutral now</text><text x="460" y="245" class="x">global village: Neutral</text><text x="830" y="190" class="h" fill="#efe2bd">Enemy gate</text><text x="830" y="220" class="s" fill="#efe2bd">reject before dispatch</text><text x="830" y="245" class="x" fill="#efe2bd">no escrow/caravan</text><text x="1200" y="190" class="h" fill="#efe2bd">Leader posture</text><text x="1200" y="220" class="s" fill="#efe2bd">need-now: close/fast/safe</text><text x="1200" y="245" class="s" fill="#efe2bd">better-trade: value/unique</text><text x="60" y="370" class="h">ACCEPTED CONTRACT: STAGED CUSTODY</text><g class="b"><rect x="60" y="425" width="230" height="100" fill="#c9d5a8"/><rect x="360" y="425" width="230" height="100" fill="#d9b16b"/><rect x="660" y="425" width="230" height="100" fill="#6d482b"/><rect x="960" y="425" width="230" height="100" fill="#4f7040"/><rect x="1260" y="425" width="240" height="100" fill="#c9d5a8"/></g><g class="x" text-anchor="middle"><text x="175" y="460">proposal</text><text x="175" y="487">material / food / item</text><text x="475" y="460">validate stance</text><text x="475" y="487">report / route</text><text x="775" y="460" fill="#efe2bd">reserve exact</text><text x="775" y="487" fill="#efe2bd">escrow lot/item</text><text x="1075" y="460" fill="#efe2bd">haulers + cargo</text><text x="1075" y="487" fill="#efe2bd">caravan route</text><text x="1380" y="460">delivery/exchange</text><text x="1380" y="487">receipt/event</text></g><path d="M290 475H360M590 475H660M890 475H960M1190 475H1260" class="a"/><rect x="60" y="650" width="1440" height="125" fill="#6d482b" class="b"/><text x="90" y="690" class="h" fill="#efe2bd">DISRUPTION / REFUSAL / DEATH / RESTART</text><text x="90" y="722" class="s" fill="#efe2bd">Before pickup release reservation. After pickup deliver, return, stockpile or last-land cache.</text><text x="90" y="748" class="x" fill="#efe2bd">Same identity, quality, provenance and condition survive; private foreign truth stays hidden.</text><text x="60" y="900" class="x">Text fallback: player chooses only stance. It never chooses cargo, route or workers.</text><text x="60" y="925" class="x">Green = accepted path; brown = escrow; rust = rejection/recovery.</text></svg>
