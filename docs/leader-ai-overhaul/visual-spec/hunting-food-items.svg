<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Hunting, food and item detail</title><desc id="desc">Hunting band, portraits, party, loot and respawn; food quality/cooking; material-led item icons and exact detail layers.</desc><style>svg{fill:#271b16}text{font-family:monospace}.h{font-size:28px;font-weight:bold}.s{font-size:16px}.x{font-size:13px}.b{stroke:#271b16;stroke-width:3}</style><rect width="1600" height="1000" fill="#efe2bd"/><rect x="24" y="20" width="1552" height="960" fill="none" stroke="#6d482b" stroke-width="5"/><text x="60" y="70" class="h">HUNTING LAIR: BAND → PANEL → PHYSICAL CONSEQUENCE</text><g class="b"><rect x="60" y="125" width="250" height="190" fill="#173c2e"/><rect x="390" y="125" width="460" height="220" fill="#d9b16b"/><rect x="930" y="125" width="270" height="220" fill="#c9d5a8"/><rect x="1280" y="125" width="220" height="220" fill="#a4492d"/></g><text x="185" y="165" class="h" text-anchor="middle" fill="#efe2bd">51–60 band</text><text x="185" y="195" class="x" text-anchor="middle" fill="#efe2bd">ten world sprites</text><text x="185" y="220" class="x" text-anchor="middle" fill="#efe2bd">exact level gated</text><text x="420" y="165" class="h">selected panel</text><text x="420" y="198" class="s">portraits: Moon Stag / Bear</text><text x="420" y="228" class="s">party 2; predicted 72–84%</text><text x="420" y="258" class="x">auto ≥70% and health ≥70%</text><text x="420" y="282" class="x">nudge: ≥45%; each health ≥80%</text><text x="960" y="165" class="h">result</text><text x="960" y="198" class="s">Meat / Hide / Bone</text><text x="960" y="228" class="s">drop, quality, wear, XP</text><text x="960" y="258" class="x">cache or injury/death recovery</text><text x="1310" y="165" class="h" fill="#efe2bd">respawn</text><text x="1310" y="198" class="s" fill="#efe2bd">absolute deadline</text><text x="1310" y="228" class="x" fill="#efe2bd">exact time gated</text><text x="60" y="425" class="h">FOOD, QUALITY, COOKING</text><g class="b"><rect x="60" y="470" width="250" height="90" fill="#c9d5a8"/><rect x="370" y="470" width="250" height="90" fill="#d9b16b"/><rect x="680" y="470" width="250" height="90" fill="#6d482b"/><rect x="990" y="470" width="250" height="90" fill="#4f7040"/><rect x="1300" y="470" width="200" height="90" fill="#c9d5a8"/></g><g class="x" text-anchor="middle"><text x="185" y="505">source lot</text><text x="185" y="530">quality retained</text><text x="495" y="505">Allowed/Reserve</text><text x="495" y="530">Forbidden</text><text x="805" y="505" fill="#efe2bd">Cookhouse 3×3</text><text x="805" y="530" fill="#efe2bd">inputs/tools</text><text x="1115" y="505" fill="#efe2bd">Raw/Simple</text><text x="1115" y="530" fill="#efe2bd">Prepared/Complex/Feast</text><text x="1400" y="505">output lot</text><text x="1400" y="530">nutrition/spoilage</text></g><text x="60" y="610" class="x">Five quality bands affect food, trade/Hole value and declared item effect/durability; lots survive storage, trade and processing.</text><text x="60" y="680" class="h">ITEM DETAIL: MATERIAL ICON + INSPECTOR LAYERS</text><rect x="60" y="725" width="300" height="145" fill="#d9b16b" class="b"/><text x="210" y="780" class="s" text-anchor="middle">silhouette</text><text x="210" y="807" class="x" text-anchor="middle">material palette/texture</text><rect x="450" y="725" width="570" height="145" fill="#c9d5a8" class="b"/><text x="480" y="765" class="h">Fine Metal Fishing Rod</text><text x="480" y="795" class="s">Fine; 61%; Warg Fang grip</text><text x="480" y="823" class="x">effect: catch/cycle; ID/provenance/reservation</text><rect x="1110" y="725" width="390" height="145" fill="#6d482b" class="b"/><text x="1140" y="770" class="s" fill="#efe2bd">No quality/augment overlay.</text><text x="1140" y="798" class="x" fill="#efe2bd">Keep compositor extension points.</text><text x="60" y="920" class="x">Text fallback: portraits appear only in selected panel; world uses bands.</text><text x="60" y="945" class="x">Icons show material; quality, augmentation, condition and provenance live in details.</text></svg>
