<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Construction and storage</title><desc id="desc">Three-stage physical construction, containers and linked workshop storage.</desc><style>svg{fill:#271b16}text{font-family:monospace}.h{font-size:28px;font-weight:bold}.s{font-size:16px}.x{font-size:13px}.b{stroke:#271b16;stroke-width:3}</style><rect width="1600" height="1000" fill="#efe2bd"/><rect x="24" y="20" width="1552" height="960" fill="none" stroke="#6d482b" stroke-width="5"/><text x="60" y="70" class="h">THREE-STAGE CONSTRUCTION: PHYSICAL CARGO FIRST</text><g class="b"><rect x="60" y="130" width="250" height="90" fill="#c9d5a8"/><rect x="370" y="130" width="250" height="90" fill="#d9b16b"/><rect x="680" y="130" width="250" height="90" fill="#6d482b"/><rect x="990" y="130" width="250" height="90" fill="#d9b16b"/><rect x="1300" y="130" width="200" height="90" fill="#4f7040"/></g><g class="x" text-anchor="middle"><text x="185" y="165">reserve site</text><text x="185" y="190">complete footprint</text><text x="495" y="165">scaffold cargo</text><text x="495" y="190">before labor</text><text x="805" y="165" fill="#efe2bd">20% scaffold</text><text x="805" y="190" fill="#efe2bd">timed labor</text><text x="1115" y="165">structural cargo</text><text x="1115" y="190">before labor</text><text x="1400" y="160" fill="#efe2bd">60% structure</text><text x="1400" y="182" fill="#efe2bd">fit-out cargo</text><text x="1400" y="204" fill="#efe2bd">20% operational</text></g><text x="60" y="275" class="s">Each stage persists required/delivered/in-transit/consumed. Upgrade: 8h × (target−1)^1.25, split 20/60/20.</text><text x="60" y="302" class="x">Death/refusal/route loss/cancel/restart conserve cargo and progress. Research grants permit; Leader chooses site/timing.</text><text x="60" y="385" class="h">STORAGE: VISIBLE SLOTS, CONTAINERS, LINKED STORE</text><rect x="60" y="430" width="290" height="260" fill="#c9d5a8" class="b"/><text x="90" y="470" class="h">stockpile tile</text><text x="90" y="505" class="s">four visible loose slots</text><text x="90" y="535" class="s">lots/reservations visible</text><rect x="430" y="430" width="430" height="260" fill="#d9b16b" class="b"/><text x="460" y="470" class="h">container contract</text><text x="460" y="505" class="s">Basket 4; Barrel 8 one-kind</text><text x="460" y="535" class="s">Crate 8; Chest 16; Rack 8</text><text x="460" y="575" class="x">one visible slot; preserves quality</text><text x="460" y="598" class="x">provenance, reservation, stable IDs</text><text x="460" y="625" class="x">fullness is inspectable</text><rect x="940" y="430" width="260" height="260" fill="#6d482b" class="b"/><text x="1070" y="470" class="h" text-anchor="middle" fill="#efe2bd">Workshop 3×3</text><text x="1070" y="510" class="s" text-anchor="middle" fill="#efe2bd">full footprint</text><text x="1070" y="560" class="x" text-anchor="middle" fill="#efe2bd">linked store adjacent</text><text x="1070" y="582" class="x" text-anchor="middle" fill="#efe2bd">outside footprint</text><rect x="1280" y="430" width="220" height="260" fill="#c9d5a8" class="b"/><text x="1305" y="470" class="h">haul</text><text x="1305" y="505" class="s">exact zone</text><text x="1305" y="532" class="s">container</text><text x="1305" y="570" class="x">missing input</text><text x="1305" y="592" class="x">creates task:</text><text x="1305" y="614" class="x">source/route/cargo</text><text x="60" y="790" class="h">INSPECTOR STATE SHEET</text><text x="60" y="825" class="s">Construction: stage, footprint, workers, duration, cargo, blocker.</text><text x="60" y="852" class="s">Storage: slot/fullness, compatibility, internal identity, recovery destination.</text><text x="60" y="910" class="x">Text fallback: pale green space; gold inventory; brown reservation; rust recovery.</text><text x="60" y="935" class="x">Roads, walls, farms, zones and containers keep their own physical sequences.</text></svg>
