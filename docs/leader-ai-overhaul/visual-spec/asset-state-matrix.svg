<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Asset and visual state matrix</title><desc id="desc">The matrix maps visual families to authoritative fields, deterministic art keys, visible state, report restrictions and accessible text equivalents. Every asset also needs native dimensions, transparent bounds, gameplay-zoom evidence and a textual fallback.</desc><style>svg{fill:#271b16}text{font-family:monospace}.h{font-size:26px;font-weight:bold}.s{font-size:15px}.x{font-size:13px}.b{stroke:#271b16;stroke-width:2}.hd{fill:#6d482b}</style><rect width="1600" height="1000" fill="#efe2bd"/><rect x="24" y="20" width="1552" height="960" fill="none" stroke="#6d482b" stroke-width="5"/><text x="56" y="70" class="h">ASSET-STATE MATRIX: ART KEY + AUTHORITATIVE TRIGGER + TEXT EQUIVALENT</text><text x="56" y="96" class="s">Every record uses a deterministic lookup. Exact ecology, respawn, unrevealed sites and developer trace are never inferred by rendering.</text><g class="b"><rect x="55" y="135" width="220" height="44" class="hd"/><rect x="275" y="135" width="350" height="44" class="hd"/><rect x="625" y="135" width="300" height="44" class="hd"/><rect x="925" y="135" width="250" height="44" class="hd"/><rect x="1175" y="135" width="370" height="44" class="hd"/></g><g class="x" fill="#efe2bd"><text x="70" y="163" fill="#efe2bd">family / native class</text><text x="290" y="163" fill="#efe2bd">authoritative trigger</text><text x="640" y="163" fill="#efe2bd">visible state / art key</text><text x="940" y="163" fill="#efe2bd">report restriction</text><text x="1190" y="163" fill="#efe2bd">accessible equivalent</text></g><g class="b"><rect x="55" y="179" width="1490" height="65" fill="#c9d5a8"/><rect x="55" y="244" width="1490" height="65" fill="#d9b16b"/><rect x="55" y="309" width="1490" height="65" fill="#efe2bd"/><rect x="55" y="374" width="1490" height="65" fill="#c9d5a8"/><rect x="55" y="439" width="1490" height="65" fill="#d9b16b"/><rect x="55" y="504" width="1490" height="65" fill="#efe2bd"/><rect x="55" y="569" width="1490" height="65" fill="#c9d5a8"/><rect x="55" y="634" width="1490" height="65" fill="#d9b16b"/><rect x="55" y="699" width="1490" height="65" fill="#efe2bd"/></g><g class="x"><text x="70" y="217">Hole · 80×80 + 30 layers</text><text x="290" y="217">Width / Depth / Darkness; feed stage</text><text x="640" y="217">base + cumulative layers</text><text x="940" y="217">report-safe rationale only</text><text x="1190" y="217">“Hole; W4 D3 Dark5; feed hauling”</text><text x="70" y="282">Lair · ten band sprites</text><text x="290" y="282">revealed band / selection</text><text x="640" y="282">lair_band_01…10</text><text x="940" y="282">exact level/respawn gated</text><text x="1190" y="282">“Enemy Lair band 51–60; selected”</text><text x="70" y="347">Portrait · panel only</text><text x="290" y="347">selected roster creature ID</text><text x="640" y="347">20 portrait keys</text><text x="940" y="347">never a world sprite</text><text x="1190" y="347">“Moon Stag portrait; expected drops”</text><text x="70" y="412">Cookhouse/Workshop · 3×3</text><text x="290" y="412">footprint + stage + task</text><text x="640" y="412">nine-cell state sheet</text><text x="940" y="412">normal report projection</text><text x="1190" y="412">“Cookhouse full footprint; waiting Herbs”</text><text x="70" y="477">Fishing Hut · 3×3/dock</text><text x="290" y="477">orientation, dock/water, staff</text><text x="640" y="477">four directions; idle/work</text><text x="940" y="477">exact fish stock hidden</text><text x="1190" y="477">“East Hut; dock; fisher shoreline”</text><text x="70" y="542">Apple/farm/ecology</text><text x="290" y="542">tree fullness / crop stage</text><text x="640" y="542">empty / low / mid / full</text><text x="940" y="542">regrowth hidden L1–3</text><text x="1190" y="542">“Apple tree low; slow observed regrowth”</text><text x="70" y="607">Food/item icon</text><text x="290" y="607">content ID/material/condition</text><text x="640" y="607">silhouette + material palette</text><text x="940" y="607">quality/augment detail only</text><text x="1190" y="607">“Fine Metal Rod; 61%; Warg grip”</text><text x="70" y="672">Storage/container</text><text x="290" y="672">slots, internal lots, capacity</text><text x="640" y="672">empty / partial / full</text><text x="940" y="672">report-safe lots</text><text x="1190" y="672">“Crate: 6/8 compatible; one reserved”</text><text x="70" y="737">Construction/task marker</text><text x="290" y="737">stage, geometry, route/cargo</text><text x="640" y="737">scaffold / structure / fit-out</text><text x="940" y="737">bounded blocker only</text><text x="1190" y="737">“Workshop structure 60%; timber transit”</text></g><rect x="55" y="830" width="1490" height="78" fill="#6d482b" class="b"/><text x="80" y="865" class="s" fill="#efe2bd">Validation: native transparent bounds; gameplay zoom; deterministic ArtKey; state transition/despawn/restart; keyboard/AccessKit label; prose fallback.</text><text x="80" y="892" class="x" fill="#efe2bd">Text fallback: renderer consumes snapshot art/state fields. It never invents an unseen site, exact ecology/replenishment, exact respawn, private foreign state or developer trace.</text></svg>
