<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Family and governance</title><desc id="desc">Family work, housing, mentoring, elections, officers, succession and expulsion.</desc><style>svg{fill:#271b16}text{font-family:monospace}.h{font-size:28px;font-weight:bold}.s{font-size:16px}.x{font-size:13px}.b{stroke:#271b16;stroke-width:3}</style><rect width="1600" height="1000" fill="#efe2bd"/><rect x="24" y="20" width="1552" height="960" fill="none" stroke="#6d482b" stroke-width="5"/><text x="60" y="70" class="h">FAMILY, ENTERPRISE, HOUSING, AND MENTORING</text><g class="b"><rect x="60" y="140" width="250" height="90" fill="#c9d5a8"/><rect x="370" y="140" width="250" height="90" fill="#d9b16b"/><rect x="680" y="140" width="250" height="90" fill="#6d482b"/><rect x="990" y="140" width="250" height="90" fill="#4f7040"/><rect x="1300" y="140" width="200" height="90" fill="#c9d5a8"/></g><g class="x" text-anchor="middle"><text x="185" y="173">completed work</text><text x="185" y="198">declared XP</text><text x="495" y="173">skill/Mastery</text><text x="495" y="198">effect cap 100</text><text x="805" y="173" fill="#efe2bd">family tradition</text><text x="805" y="198" fill="#efe2bd">+10% learning</text><text x="1115" y="173" fill="#efe2bd">birth seed</text><text x="1115" y="198" fill="#efe2bd">aptitude</text><text x="1400" y="173">mentor</text><text x="1400" y="198">best-fit work</text></g><rect x="60" y="310" width="680" height="165" fill="#d9b16b" class="b"/><text x="90" y="350" class="h">autonomous household</text><text x="90" y="385" class="s">non-kin partnership → housing → household</text><text x="90" y="415" class="s">Den 5; Family Home 2+4; Elder Lodge 8</text><rect x="840" y="310" width="660" height="165" fill="#c9d5a8" class="b"/><text x="870" y="350" class="h">visible teaching</text><text x="870" y="385" class="s">after 3 tasks; emergency defers</text><text x="870" y="415" class="s">Home/Nursery/School/office/enterprise</text><text x="60" y="560" class="h">ELECTION, OFFICERS, SUCCESSION, EXPULSION</text><g class="b"><rect x="60" y="610" width="250" height="90" fill="#c9d5a8"/><rect x="370" y="610" width="250" height="90" fill="#d9b16b"/><rect x="680" y="610" width="250" height="90" fill="#6d482b"/><rect x="990" y="610" width="250" height="90" fill="#4f7040"/><rect x="1300" y="610" width="200" height="90" fill="#a4492d"/></g><g class="x" text-anchor="middle"><text x="185" y="643">eligible Adults</text><text x="185" y="668">and Elders</text><text x="495" y="643">top-five merit</text><text x="495" y="668">25/20/15/15/10/10/5</text><text x="805" y="643" fill="#efe2bd">cat ballots</text><text x="805" y="668" fill="#efe2bd">relational/analytical</text><text x="1115" y="643" fill="#efe2bd">elected Leader</text><text x="1115" y="668" fill="#efe2bd">appoints officers</text><text x="1400" y="643" fill="#efe2bd">scheduled/snap</text><text x="1400" y="668" fill="#efe2bd">succession</text></g><rect x="60" y="780" width="590" height="95" fill="#efe2bd" stroke="#a4492d" stroke-width="4"/><text x="90" y="820" class="s">God: replaceable +10 block; never appoints.</text><text x="90" y="847" class="x">Clearance is duty-earned, never inherited.</text><rect x="750" y="780" width="750" height="95" fill="#6d482b" class="b"/><text x="780" y="818" class="s" fill="#efe2bd">Expulsion: adult/household; dependents with guardian.</text><text x="780" y="845" class="x" fill="#efe2bd">Resolve job, office, residence, cargo/reservations, items before departure.</text><text x="60" y="925" class="x">Text fallback: report-safe appointment may be poor; death or expulsion creates a snap election.</text></svg>
