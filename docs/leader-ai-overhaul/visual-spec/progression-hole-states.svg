<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Research lanes and Hole states</title><desc id="desc">Notes and Void research lanes plus physical Hole feed and upgrade pipelines.</desc><style>svg{fill:#271b16}text{font-family:monospace}.h{font-size:28px;font-weight:bold}.s{font-size:16px}.x{font-size:13px}.b{stroke:#271b16;stroke-width:3}.a{stroke:#271b16;stroke-width:3;fill:none}</style><rect width="1600" height="1000" fill="#efe2bd"/><rect x="24" y="20" width="1552" height="960" fill="none" stroke="#6d482b" stroke-width="5"/><text x="60" y="70" class="h">TWO INDEPENDENT RESEARCH LANES</text><g class="b"><rect x="60" y="130" width="250" height="100" fill="#c9d5a8"/><rect x="60" y="280" width="250" height="100" fill="#173c2e"/><rect x="410" y="120" width="350" height="130" fill="#d9b16b"/><rect x="410" y="285" width="350" height="95" fill="#c9d5a8"/><rect x="850" y="190" width="310" height="110" fill="#6d482b"/><rect x="1260" y="150" width="240" height="80" fill="#4f7040"/><rect x="1260" y="280" width="240" height="80" fill="#a4492d"/></g><text x="85" y="170" class="s">RESEARCH NOTES</text><text x="85" y="200" class="x">ordinary studies</text><text x="85" y="320" class="s" fill="#efe2bd">VOID INSIGHT</text><text x="85" y="350" class="x" fill="#efe2bd">axes / boosts</text><text x="435" y="158" class="h">GOD LANE</text><text x="435" y="188" class="s">queue ≤64; front cost frozen</text><text x="435" y="213" class="x">staffed work; preparation</text><text x="435" y="234" class="x">is 25% physical labor</text><text x="435" y="325" class="h">LEADER LANE</text><text x="435" y="352" class="s">free, instant, prerequisite-ready</text><text x="1005" y="230" class="h" text-anchor="middle" fill="#efe2bd">CANONICAL LEDGER</text><text x="1005" y="258" class="x" text-anchor="middle" fill="#efe2bd">one ownership record</text><text x="1380" y="195" class="s" text-anchor="middle" fill="#efe2bd">ordinary capability</text><text x="1380" y="325" class="s" text-anchor="middle" fill="#efe2bd">Hole axis / boost</text><path d="M310 180H410M310 330H410M760 185H850M760 330H800V270H850M1160 245H1260" class="a"/><text x="60" y="460" class="h">HOLE: FIXED 5×5; PHYSICAL FEED AND AXIS PIPELINES</text><text x="60" y="488" class="s">Axes 0–10; 40-minute intake; Width 1+width; Depth cap 10×(1+depth); Darkness gates content.</text><g class="b"><rect x="60" y="540" width="230" height="95" fill="#c9d5a8"/><rect x="360" y="540" width="230" height="95" fill="#d9b16b"/><rect x="660" y="540" width="230" height="95" fill="#6d482b"/><rect x="960" y="540" width="230" height="95" fill="#4f7040"/><rect x="1260" y="540" width="240" height="95" fill="#a4492d"/></g><g class="x" text-anchor="middle"><text x="175" y="575">believed candidates</text><text x="175" y="602">and fallbacks</text><text x="475" y="575">validate gate/route</text><text x="475" y="602">and amount</text><text x="775" y="575" fill="#efe2bd">reserve exact</text><text x="775" y="602" fill="#efe2bd">feed lot</text><text x="1075" y="575" fill="#efe2bd">haul; consume</text><text x="1075" y="602" fill="#efe2bd">once; award Void</text><text x="1380" y="575" fill="#efe2bd">recover origin</text><text x="1380" y="602" fill="#efe2bd">stockpile/cache</text></g><path d="M290 588H360M590 588H660M890 588H960M1190 588H1260" class="a"/><g class="b"><rect x="60" y="740" width="300" height="85" fill="#c9d5a8"/><rect x="450" y="740" width="300" height="85" fill="#d9b16b"/><rect x="840" y="740" width="300" height="85" fill="#6d482b"/><rect x="1230" y="740" width="270" height="85" fill="#4f7040"/></g><g class="x" text-anchor="middle"><text x="210" y="775">one active axis project</text><text x="600" y="775">stage cargo first</text><text x="990" y="775" fill="#efe2bd">20% / 60% / 20% labor</text><text x="1365" y="775" fill="#efe2bd">commit / recovery</text></g><text x="60" y="900" class="x">Text fallback: tasks use central 3×3 and pinned edge; full 5×5 never resizes.</text><text x="60" y="925" class="x">One feed and one axis project are active; an accepted feed is not hidden-vetoed.</text></svg>
