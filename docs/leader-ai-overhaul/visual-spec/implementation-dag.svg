<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Implementation dependency graph</title><desc id="desc">Plan one and two leaves converge to one world-tick integration and final cutover.</desc><style>svg{fill:#271b16}text{font-family:monospace}.h{font-size:28px;font-weight:bold}.s{font-size:16px}.x{font-size:13px}.b{stroke:#271b16;stroke-width:3}.a{stroke:#271b16;stroke-width:3;fill:none}</style><rect width="1600" height="1000" fill="#efe2bd"/><rect x="24" y="20" width="1552" height="960" fill="none" stroke="#6d482b" stroke-width="5"/><text x="60" y="70" class="h">IMPLEMENTATION DAG: ONE AUTHORITATIVE CUTOVER</text><text x="60" y="96" class="s">Closure needs behavior, wire, persistence, projection, UI, diagnostics, legacy absence and evidence.</text><g class="b"><rect x="60" y="145" width="230" height="70" fill="#d9b16b"/><rect x="370" y="145" width="230" height="70" fill="#c9d5a8"/><rect x="680" y="145" width="230" height="70" fill="#d9b16b"/></g><g class="x" text-anchor="middle"><text x="175" y="180">35 specification</text><text x="485" y="180">36 catalog/art keys</text><text x="795" y="180">37 quality lots</text></g><path d="M290 180H370M600 180H680" class="a"/><g class="b"><rect x="60" y="300" width="210" height="72" fill="#c9d5a8"/><rect x="330" y="300" width="210" height="72" fill="#d9b16b"/><rect x="600" y="300" width="210" height="72" fill="#c9d5a8"/><rect x="870" y="300" width="210" height="72" fill="#d9b16b"/><rect x="1140" y="300" width="360" height="72" fill="#c9d5a8"/></g><g class="x" text-anchor="middle"><text x="165" y="335">38–40 food/cooking/fishing</text><text x="435" y="335">41–43 Hole/hunt/craft</text><text x="705" y="335">44/58 research</text><text x="975" y="335">55–57 family/governance</text><text x="1320" y="335">59/60 construction/storage/world</text></g><rect x="490" y="510" width="320" height="105" fill="#173c2e" class="b"/><text x="650" y="552" class="h" text-anchor="middle" fill="#efe2bd">45 + 63</text><text x="650" y="580" class="s" text-anchor="middle" fill="#efe2bd">planner / officers</text><rect x="930" y="510" width="330" height="105" fill="#6d482b" class="b"/><text x="1095" y="552" class="h" text-anchor="middle" fill="#efe2bd">46 world-tick</text><text x="1095" y="580" class="s" text-anchor="middle" fill="#efe2bd">reserve / transaction</text><path d="M165 372V445H650V510M435 372V445H650M705 372V445H650M975 372V445H650M1320 372V445H650M810 562H930" class="a"/><g class="b"><rect x="60" y="730" width="260" height="80" fill="#d9b16b"/><rect x="410" y="730" width="260" height="80" fill="#c9d5a8"/><rect x="760" y="730" width="260" height="80" fill="#d9b16b"/><rect x="1110" y="730" width="390" height="80" fill="#a4492d"/></g><g class="x" text-anchor="middle"><text x="190" y="765">64 protocol/redaction</text><text x="540" y="765">65 persistence/server</text><text x="890" y="765">54/66–68 client/render</text><text x="1305" y="765" fill="#efe2bd">69 diagnostics → 70 legacy deletion</text></g><text x="60" y="900" class="x">Hot roots have one owner: runtime, protocol, server, persistence and client shell/world renderer.</text><text x="60" y="925" class="x">Leaf work may be independent; hot-root cutover is singular and ordered.</text></svg>
