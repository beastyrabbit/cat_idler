<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Five-screen responsive shell</title><desc id="desc">Five routes, six Council tabs and desktop responsive checkpoints.</desc><style>svg{fill:#271b16}text{font-family:monospace}.h{font-size:28px;font-weight:bold}.s{font-size:16px}.x{font-size:13px}.b{stroke:#271b16;stroke-width:3}</style><rect width="1600" height="1000" fill="#efe2bd"/><rect x="24" y="20" width="1552" height="960" fill="none" stroke="#6d482b" stroke-width="5"/><text x="60" y="70" class="h">ONE SHELL · FIVE PRIMARY SCREENS · SIX COUNCIL TABS</text><rect x="60" y="130" width="910" height="420" fill="#c9d5a8" class="b"/><rect x="60" y="130" width="910" height="55" fill="#6d482b" class="b"/><text x="85" y="165" class="s" fill="#efe2bd">Log · Stores · Village · Research · Council</text><rect x="85" y="220" width="190" height="280" fill="#d9b16b" class="b"/><text x="110" y="260" class="h">routes</text><text x="110" y="300" class="s">Log / Stores</text><text x="110" y="330" class="s">Village / Research</text><text x="110" y="360" class="s">Council</text><text x="110" y="400" class="x">one route visible</text><rect x="320" y="220" width="620" height="280" fill="#efe2bd" class="b"/><text x="350" y="260" class="h">Council example</text><text x="350" y="300" class="s">Plans · Tasks · Cats · Hole</text><text x="350" y="330" class="s">Diplomacy · Trade</text><text x="350" y="375" class="s">Plans: beliefs/priorities/omissions</text><text x="350" y="402" class="s">Tasks: exact geometry/cargo</text><text x="350" y="429" class="s">Cats/Hole/trade: report-safe details</text><rect x="1040" y="130" width="460" height="420" fill="#d9b16b" class="b"/><text x="1070" y="170" class="h">responsibilities</text><text x="1070" y="210" class="s">Log: events; Stores: zones</text><text x="1070" y="240" class="s">Village: cats/homes/world</text><text x="1070" y="270" class="s">Research: queue/graph</text><text x="1070" y="295" class="s">inspector; both lanes</text><text x="1070" y="330" class="s">start: off-map showcase</text><text x="1070" y="365" class="x">no snapshot/action/tick/save</text><text x="1070" y="388" class="x">focus/scroll/disabled/loading</text><text x="1070" y="411" class="x">connection/error: authored</text><text x="60" y="640" class="h">RESPONSIVE: NATIVE + WASM · 100 / 115 / 130</text><g class="b"><rect x="60" y="690" width="270" height="130" fill="#d9b16b"/><rect x="360" y="690" width="270" height="130" fill="#c9d5a8"/><rect x="660" y="690" width="270" height="130" fill="#d9b16b"/><rect x="960" y="690" width="270" height="130" fill="#c9d5a8"/><rect x="1260" y="690" width="240" height="130" fill="#d9b16b"/></g><g class="x"><text x="85" y="730">1024×768 compact</text><text x="85" y="755">ordered sections</text><text x="385" y="730">1280×800 two-region</text><text x="385" y="755">inspector drawer</text><text x="685" y="730">1920×1080 three-region</text><text x="685" y="755">normal density</text><text x="985" y="730">2560×1440 worktable</text><text x="985" y="755">more world</text><text x="1285" y="730">3840×2160 desktop</text><text x="1285" y="755">retain detail</text></g><text x="60" y="900" class="x">Text fallback: all viewports are reviewed at 100%, 115% and 130%; phones are out of scope.</text><text x="60" y="925" class="x">Layout reprioritizes information instead of creating an overpadded stack.</text></svg>
