<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" role="img" aria-labelledby="title desc"><title id="title">Authority, visibility and stale actions</title><desc id="desc">Report-safe authority loop, five report levels, and stale action recovery.</desc><style>svg{fill:#271b16}text{font-family:monospace}.h{font-size:28px;font-weight:bold}.s{font-size:16px}.x{font-size:13px}.b{stroke:#271b16;stroke-width:3}.a{stroke:#271b16;stroke-width:3;fill:none}</style><rect width="1600" height="1000" fill="#efe2bd"/><rect x="24" y="20" width="1552" height="960" fill="none" stroke="#6d482b" stroke-width="5"/><text x="60" y="70" class="h">REPORT-SAFE AUTHORITY LOOP</text><text x="60" y="96" class="s">World truth → observations → officer reports → beliefs → Leader plans.</text><g class="b"><rect x="60" y="150" width="230" height="85" fill="#173c2e"/><rect x="370" y="150" width="230" height="85" fill="#c9d5a8"/><rect x="680" y="150" width="230" height="85" fill="#d9b16b"/><rect x="990" y="150" width="230" height="85" fill="#c9d5a8"/><rect x="1300" y="150" width="220" height="85" fill="#6d482b"/></g><g class="s" text-anchor="middle"><text x="175" y="198" fill="#efe2bd">world truth</text><text x="485" y="198">observations</text><text x="795" y="198">officer reports</text><text x="1105" y="198">beliefs / plans</text><text x="1410" y="185" fill="#efe2bd">reserve → task</text><text x="1410" y="210" fill="#efe2bd">route / cargo</text></g><path d="M290 192H370M600 192H680M910 192H990M1220 192H1300" class="a"/><rect x="620" y="285" width="350" height="80" fill="#efe2bd" stroke="#a4492d" stroke-width="4"/><text x="795" y="320" class="s" text-anchor="middle">God report projection</text><text x="795" y="345" class="x" text-anchor="middle">same authorized reports; broad nudge only</text><text x="60" y="440" class="h">EFFECTIVE REPORT LEVEL</text><g class="b"><rect x="60" y="480" width="290" height="115" fill="#d9b16b"/><rect x="350" y="480" width="290" height="115" fill="#c9d5a8"/><rect x="640" y="480" width="290" height="115" fill="#d9b16b"/><rect x="930" y="480" width="290" height="115" fill="#c9d5a8"/><rect x="1220" y="480" width="300" height="115" fill="#d9b16b"/></g><g class="x"><text x="80" y="515">L1 stock ±40%; flow hidden</text><text x="80" y="540">regeneration hidden</text><text x="370" y="515">L2 stock ±25%; trend only</text><text x="370" y="540">regeneration hidden</text><text x="660" y="515">L3 stock ±12%; coarse range</text><text x="660" y="540">regeneration hidden</text><text x="950" y="515">L4 stock ±5%; numeric rate</text><text x="950" y="540">ecology ±25% estimate</text><text x="1240" y="515">L5 stock ±2%</text><text x="1240" y="540">high-confidence; ecology ±10%</text></g><text x="60" y="680" class="h">STALE ACTION</text><g class="b"><rect x="60" y="720" width="300" height="80" fill="#c9d5a8"/><rect x="440" y="720" width="300" height="80" fill="#d9b16b"/><rect x="820" y="720" width="300" height="80" fill="#a4492d"/><rect x="1200" y="720" width="320" height="80" fill="#c9d5a8"/></g><g class="x" text-anchor="middle"><text x="210" y="755">snapshot + expected version</text><text x="590" y="755">authenticated action + ID</text><text x="970" y="755" fill="#efe2bd">typed stale/conflict</text><text x="1360" y="748">refresh report-safe snapshot</text><text x="1360" y="770">reconcile or retry</text></g><path d="M360 760H440M740 760H820M1120 760H1200" class="a"/><text x="60" y="900" class="x">Text fallback: exact stock, ecology, route, score and private foreign state never enter projection.</text><text x="60" y="925" class="x">Solid flow is authoritative/physical; reported values are estimates at the five levels above.</text></svg>
